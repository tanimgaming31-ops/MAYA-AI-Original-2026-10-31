name: Bootstrap and build original MAYA Android app
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-maya.yml
      - app/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - FEATURE_STATUS.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAYA
        uses: actions/checkout@v4

      - name: Check independently authored Android sources
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/tanimworld/maya/MainActivity.java
          test -f app/src/main/java/com/tanimworld/maya/LiveSession.java
          test -f LICENSE.txt
          echo 'Tracked independent source verified.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 with preinstalled sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME: ${ANDROID_HOME:-not-set}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using SDK manager at: $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MAYA debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-TaNiM-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct APK download on GitHub Releases
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v0.3.0-original-debug"
          ASSET="MAYA-AI-Voice-Assistant-TaNiM-world-v0.3-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$ASSET"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" --target "$GITHUB_SHA" --title "MAYA AI Voice Assistant v0.3 (Android Debug APK)" --notes "Original MAYA Android source by TaNiM world. This is a DEBUG APK for testing, not a verified production release. Some features are incomplete and phone testing is required. Download the APK asset directly below."
          fi
          gh release view "$TAG" --json url,assets
