name: Bootstrap and build original MAYA Android app
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/bootstrap-maya.yml
      - app/**
      - build.gradle
      - gradle.properties
      - settings.gradle
      - FEATURE_STATUS.md
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout MAYA
        uses: actions/checkout@v4

      - name: Check independently authored Android sources
        shell: bash
        run: |
          set -euo pipefail
          test -f app/src/main/java/com/tanimworld/maya/MainActivity.java
          test -f app/src/main/java/com/tanimworld/maya/LiveSession.java
          test -f LICENSE.txt
          echo 'Tracked independent source verified.'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35 with preinstalled sdkmanager
        shell: bash
        run: |
          set -euo pipefail
          echo "ANDROID_HOME: ${ANDROID_HOME:-not-set}"
          SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "Using SDK manager at: $SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build MAYA debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload test APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MAYA-TaNiM-world-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
